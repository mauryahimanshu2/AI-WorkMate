<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive API documentation for AI WorkMate" />
    <title>AI WorkMate API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
      }

      body {
        margin: 0;
        background: #f6f7fb;
      }

      .topbar {
        display: none;
      }

      .api-header {
        padding: 22px clamp(20px, 5vw, 72px);
        color: #fff;
        background: linear-gradient(120deg, #17152f, #5141a8);
        box-shadow: 0 8px 28px rgb(30 23 78 / 18%);
      }

      .api-header strong {
        display: block;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      .api-header span {
        display: block;
        margin-top: 4px;
        color: #ded9ff;
        font-size: 0.9rem;
      }

      #swagger-ui {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }

      .swagger-ui .info {
        margin: 24px 0 34px;
      }

      .swagger-ui .scheme-container,
      .swagger-ui .opblock,
      .swagger-ui .model-container {
        border-radius: 10px;
        box-shadow: 0 4px 18px rgb(31 26 77 / 8%);
      }

      .swagger-ui .opblock-tag {
        border-bottom-color: #dedfeb;
      }

      .swagger-ui .btn.authorize {
        border-color: #5141a8;
        color: #5141a8;
      }
    </style>
  </head>
  <body>
    <header class="api-header">
      <strong>AI WorkMate API</strong>
      <span>OpenAPI reference and interactive request explorer</span>
    </header>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
      window.addEventListener('load', () => {
        SwaggerUIBundle({
          url: './openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          displayRequestDuration: true,
          docExpansion: 'list',
          filter: true,
          persistAuthorization: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'BaseLayout',
          tryItOutEnabled: true,
        });
      });
    </script>
  </body>
</html>
